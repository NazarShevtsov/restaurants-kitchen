<ul class="sidebar-nav list-group">
  {% if user.is_authenticated %}
    <li class="list-group-item">User: <a href="{{ user.get_absolute_url }}">{{ user.get_username }}</a></li>
    <li class="list-group-item">
      <form method="post" action="{% url 'logout' %}" style="display: inline;">
        {% csrf_token %}
        <button type="submit" style="background: none; border: none; padding: 0; color: blue; text-decoration: underline; cursor: pointer;">
            Logout
        </button>
      </form>
    </li>
  {% else %}
    <li class="list-group-item"><a href="{% url 'login'%}?next={{request.path}}">Login</a></li>
  {% endif %}

  <br>

  <li class="list-group-item"><a href="{% url 'menu:index' %}">Home</a></li>
  <li class="list-group-item"><a href="#">All cooks</a></li><!-- url 'menu:cook-list' -->
  <li class="list-group-item"><a href="#">All dishes</a></li><!-- url 'menu:dish-list' -->
  <li class="list-group-item"><a href="#">All dish types</a></li><!-- url url 'menu:dishType-list' -->
</ul>
