{% extends "base.html" %}

{% block content %}
  <h1>Delete cook form</h1>
  <form action="" method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this cook?
      (<a href="{% url 'menu:cook-detail' pk=cook.id %}">{{ cook.username }})</a>
    </p>
    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{% url 'menu:cook-list' %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
