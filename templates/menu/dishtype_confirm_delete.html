{% extends "base.html" %}

{% block content %}
  <h1>Delete dish type form</h1>
  <form action="" method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this dish type? ({{ dishtype.name }})</p>
    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{% url 'menu:dish-type-list' %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
