{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Add new dish type to your menu</h1>

  <form method="post" action="">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Add" class="btn btn-primary">
    <a href="{% url "menu:dish-type-list" %}" style="color: white; text-decoration: none" class="btn btn-secondary">
      Cancel
    </a>
  </form>
{% endblock %}
