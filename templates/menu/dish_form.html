{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>{{ object|yesno:"Update,Create" }} dish</h1>

  <form method="post" action="">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Submit" class="btn btn-primary">
    <a href="{% url 'menu:dish-list' %}" class="btn btn-secondary" style="text-decoration: none">Cancel</a>
  </form>

{% endblock %}
