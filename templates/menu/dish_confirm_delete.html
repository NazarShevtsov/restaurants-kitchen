{% extends "base.html" %}

{% block content %}
  <h1>Delete dish form</h1>
  <form action="" method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this dish?
      (<a href="{% url 'menu:dish-detail' pk=dish.id %}">{{ dish.name }})</a>
    </p>
    <input type="submit" value="Yes" class="btn btn-danger">
    <a href="{% url 'menu:dish-list' %}" class="btn btn-primary">Cancel</a>
  </form>
{% endblock %}
