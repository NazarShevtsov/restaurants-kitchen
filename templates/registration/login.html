{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
	<h1>Login</h1>
  
  {% if form.errors %}
  	<p style="color: red">Invalid credentials</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Log in">
  </form>
{% endblock %}
