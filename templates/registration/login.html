{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}<title>Login | Menu Management</title>{% endblock %}

{% block content %}
<section id="login">
    <div class="container">
        <div class="section-header">
            <h3>Login</h3>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-col-2">
                    <div class="login-form">

                        {% if form.errors %}
                            <div class="alert alert-danger">
                                Invalid username or password.
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}

                            {{ form|crispy }}

                            <button type="submit" class="btn btn-primary">
                                Log in
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
